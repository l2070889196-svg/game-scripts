name: Auto Update Script Versions

on:
  push:
    branches: [ main ]
    paths:
      - '*.sh'

jobs:
  update-version:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changed scripts
        id: detect
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep '\.sh$' | tr '\n' ' ')
          if [ -z "$CHANGED" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "files=$CHANGED" >> $GITHUB_OUTPUT
          fi

      - name: Update versions
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          declare -A MAP
          MAP["cfm.sh"]="cfm_script"
          MAP["verify.sh"]="dra_verify"
          MAP["driver.sh"]="dra_driver"
          MAP["yuyan.sh"]="yuyan_script"
          MAP["linyu_verify.sh"]="linyu_verify"
          MAP["linyu_driver.sh"]="linyu_driver"
          MAP["arena_script.sh"]="arena_script"
          MAP["arena_driver.sh"]="arena_driver"
          MAP["gemini.sh"]="hpjy_script"

          for file in ${{ steps.detect.outputs.files }}; do
            fname=$(basename "$file")
            key="${MAP[$fname]}"
            [ -z "$key" ] && continue
            echo "Updating $key ($fname)"

            if jq -e "has(\"$key\")" scripts.json > /dev/null; then
              old=$(jq -r ".\"$key\".version" scripts.json)
              new=$(echo "$old" | awk -F. '{OFS="."; $NF=$NF+1; print}')
              echo "  $old -> $new"
              jq ".\"$key\".version=\"$new\" | .\"$key\".url=\"https://raw.githubusercontent.com/${{ github.repository }}/main/$fname\"" scripts.json > tmp.json && mv tmp.json scripts.json
            else
              echo "  Adding new key $key"
              jq ". + {\"$key\": {version: \"1.0\", url: \"https://raw.githubusercontent.com/${{ github.repository }}/main/$fname\"}}" scripts.json > tmp.json && mv tmp.json scripts.json
            fi
          done

          cat scripts.json

      - name: Commit
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add scripts.json
          git commit -m "auto: update script versions [skip ci]" || echo "No changes"
          git push

      - name: Purge CDN
        if: steps.detect.outputs.has_changes == 'true'
        run: |
          for file in ${{ steps.detect.outputs.files }}; do
            fname=$(basename "$file")
            curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$fname"
          done
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/scripts.json"
          echo "CDN purged"
