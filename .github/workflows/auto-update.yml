name: Auto Update Script Versions
on:
  push:
    branches: [ main ]
    paths:
      - '*.sh'
jobs:
  update-version:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changed scripts
        id: changed
        run: |
          echo "Changed files in this commit:"
          CHANGED=$(git show --name-only --pretty="" HEAD | grep '\.sh$' | tr '\n' ' ')
          echo "Raw changed: $CHANGED"
          if [ -z "$CHANGED" ]; then
            echo "No .sh files changed in this commit"
            echo "files=NO_CHANGES" >> $GITHUB_OUTPUT
          else
            echo "$CHANGED"
            echo "files=$CHANGED" >> $GITHUB_OUTPUT
          fi

      - name: Update versions
        if: steps.changed.outputs.files != 'NO_CHANGES'
        run: |
          echo "Updating versions for: ${{ steps.changed.outputs.files }}"
          if [ ! -f scripts.json ]; then
            echo "scripts.json not found, creating empty one"
            echo '{}' > scripts.json
          fi
          echo "Current scripts.json:"
          cat scripts.json
          for file in ${{ steps.changed.outputs.files }}; do
            filename=$(basename "$file")
            case "$filename" in
              cfm.sh) key="cfm_script" ;;
              verify.sh) key="dra_verify" ;;
              driver.sh) key="dra_driver" ;;
              yuyan.sh) key="yuyan_script" ;;
              linyu_verify.sh) key="linyu_verify" ;;
              linyu_driver.sh) key="linyu_driver" ;;
              arena_script.sh) key="arena_script" ;;
              arena_driver.sh) key="arena_driver" ;;
              gemini.sh) key="hpjy_script" ;;
              LinYuKernel.Ver3.1.8.sh) key="sjxd_script" ;;
              LinYu过电报验证.sh) key="sjxd_verify" ;;
              *) echo "No mapping for $filename, skipping"; continue ;;
            esac
            if [ ! -f "$filename" ]; then
              echo "File $filename was deleted, skipping"
              continue
            fi
            echo "Processing $key ($filename)"
            current=$(python3 -c "import json; data=json.load(open('scripts.json')); print(data.get('$key',{}).get('version','NOT_FOUND'))")
            echo "Current version: $current"
            if [ "$current" = "NOT_FOUND" ]; then
              echo "Adding new key $key with version 1.0"
              python3 -c "import json; data=json.load(open('scripts.json')); data['$key']={'version':'1.0','url':'https://raw.githubusercontent.com/${{ github.repository }}/main/$filename'}; json.dump(data,open('scripts.json','w'),indent=2,ensure_ascii=False)"
            else
              new_version=$(python3 -c "v='$current'.split('.'); v[-1]=str(int(v[-1])+1) if v[-1].isdigit() else '1'; print('.'.join(v))")
              echo "New version: $new_version"
              python3 -c "import json; data=json.load(open('scripts.json')); data['$key']['version']='$new_version'; data['$key']['url']='https://raw.githubusercontent.com/${{ github.repository }}/main/$filename'; json.dump(data,open('scripts.json','w'),indent=2,ensure_ascii=False)"
            fi
          done
          echo "Updated scripts.json:"
          cat scripts.json

      - name: Commit and push
        if: steps.changed.outputs.files != 'NO_CHANGES'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scripts.json
          git diff --cached --quiet scripts.json || git commit -m "auto: update script versions [skip ci]"
          git push

      - name: Purge CDN cache
        if: steps.changed.outputs.files != 'NO_CHANGES'
        run: |
          echo "Purging jsdelivr CDN cache..."
          for file in ${{ steps.changed.outputs.files }}; do
            filename=$(basename "$file")
            echo "Purging: $filename"
            curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$filename" || echo "Purge failed for $filename"
          done
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/scripts.json" || echo "Purge failed for scripts.json"
          echo "CDN cache purged"
