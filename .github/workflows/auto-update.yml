name: Auto Update Script Versions
on:
  push:
    branches: [ main ]
    paths:
      - '*.sh'
jobs:
  update-version:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changed scripts
        id: changed
        run: |
          echo "Changed files in this commit:"
          CHANGED=$(git show --name-only --pretty="" HEAD | grep '\.sh$' | tr '\n' ' ')
          echo "Raw changed: $CHANGED"
          if [ -z "$CHANGED" ]; then
            echo "No .sh files changed in this commit"
            echo "files=NO_CHANGES" >> $GITHUB_OUTPUT
          else
            echo "$CHANGED"
            echo "files=$CHANGED" >> $GITHUB_OUTPUT
          fi

      - name: Update versions
        if: steps.changed.outputs.files != 'NO_CHANGES'
        run: |
          echo "Updating versions for: ${{ steps.changed.outputs.files }}"
          
          declare -A FILE_TO_KEY
          FILE_TO_KEY["cfm.sh"]="cfm_script"
          FILE_TO_KEY["verify.sh"]="dra_verify"
          FILE_TO_KEY["driver.sh"]="dra_driver"
          FILE_TO_KEY["yuyan.sh"]="yuyan_script"
          FILE_TO_KEY["linyu_verify.sh"]="linyu_verify"
          FILE_TO_KEY["linyu_driver.sh"]="linyu_driver"
          FILE_TO_KEY["arena_script.sh"]="arena_script"
          FILE_TO_KEY["arena_driver.sh"]="arena_driver"
          FILE_TO_KEY["gemini.sh"]="hpjy_script"
          FILE_TO_KEY["LinYuKernel.Ver3.1.8.sh"]="sjxd_script"
          FILE_TO_KEY["LinYu过电报验证.sh"]="sjxd_verify"
          
          if [ ! -f scripts.json ]; then
            echo "scripts.json not found, creating empty one"
            echo '{}' > scripts.json
          fi
          
          echo "Current scripts.json:"
          cat scripts.json
          
          for file in ${{ steps.changed.outputs.files }}; do
            filename=$(basename "$file")
            key="${FILE_TO_KEY[$filename]}"
            if [ -z "$key" ]; then
              echo "No mapping for $filename, skipping"
              continue
            fi
            if [ ! -f "$filename" ]; then
              echo "File $filename was deleted, skipping version update"
              continue
            fi
            echo "Processing $key ($filename)"
            
            current=$(python3 -c "
import json
with open('scripts.json') as f:
    data = json.load(f)
key = '$key'
if key in data:
    print(data[key]['version'])
else:
    print('NOT_FOUND')
")
            echo "Current version: $current"
            
            if [ "$current" = "NOT_FOUND" ]; then
              echo "Adding new key $key with version 1.0"
              python3 -c "
import json
with open('scripts.json') as f:
    data = json.load(f)
data['$key'] = {'version': '1.0', 'url': 'https://raw.githubusercontent.com/${{ github.repository }}/main/$filename'}
with open('scripts.json', 'w') as f:
    json.dump(data, f, indent=2, ensure_ascii=False)
"
            else
              new_version=$(python3 -c "
v = '$current'
parts = v.split('.')
if len(parts) >= 2 and parts[-1].isdigit():
    parts[-1] = str(int(parts[-1]) + 1)
    print('.'.join(parts))
else:
    print('1.1')
")
              echo "New version: $new_version"
              python3 -c "
import json
with open('scripts.json') as f:
    data = json.load(f)
key = '$key'
if key in data:
    data[key]['version'] = '$new_version'
    data[key]['url'] = 'https://raw.githubusercontent.com/${{ github.repository }}/main/$filename'
with open('scripts.json', 'w') as f:
    json.dump(data, f, indent=2, ensure_ascii=False)
"
            fi
          done
          
          echo "Updated scripts.json:"
          cat scripts.json

      - name: Commit and push
        if: steps.changed.outputs.files != 'NO_CHANGES'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add scripts.json
          git diff --cached --quiet scripts.json || git commit -m "auto: update script versions [skip ci]"
          git push

      - name: Purge CDN cache
        if: steps.changed.outputs.files != 'NO_CHANGES'
        run: |
          echo "Purging jsdelivr CDN cache..."
          for file in ${{ steps.changed.outputs.files }}; do
            filename=$(basename "$file")
            echo "Purging: $filename"
            curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$filename" || echo "Purge failed for $filename"
          done
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/scripts.json" || echo "Purge failed for scripts.json"
          echo "CDN cache purged"
